# ──────────────────────────────────────────────────────
# Render Blueprint — Urban Hydrology Engine
# https://render.com/docs/blueprint-spec
#
# Deploy:
#   1. Create a free Supabase project at https://supabase.com
#      (PostGIS is pre-enabled — no extra steps needed)
#   2. In Supabase: Project Settings → Database → Connection String
#      Copy the URI (use the "URI" tab, not the pooler)
#   3. Connect this repo on Render → it detects render.yaml automatically
#   4. In Render dashboard set DATABASE_URL to your Supabase URI
#   5. Also set OWM_API_KEY (get a free key at openweathermap.org)
# ──────────────────────────────────────────────────────

services:
  # ── FastAPI backend + static frontend ────────────────
  - type: web
    name: hydrology-engine
    runtime: docker
    plan: free
    rootDir: urban-hydrology-engine
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Set to your Supabase connection URI in dashboard
                             # Format: postgresql://postgres:[pass]@db.[ref].supabase.co:5432/postgres
      - key: OWM_API_KEY
        sync: false          # Set manually in Render dashboard (openweathermap.org)
      - key: API_SECRET_KEY
        value: "hydro-mvp-secret-2026"   # fixed key — matches frontend hardcoded value
      - key: CITY_LAT
        value: "28.65"
      - key: CITY_LON
        value: "77.22"
      - key: RAIN_POLL_INTERVAL_SECONDS
        value: "600"
      - key: RAIN_COVERAGE_DEGREES
        value: "0.15"
      - key: TILESERV_URL
        value: ""            # Leave empty — pg_tileserv not used on free tier
      - key: PYTHON_VERSION
        value: "3.11.7"

  # ── pg_tileserv (vector tiles) — optional ────────────
  # Uncomment to add a private pg_tileserv service.
  # Render free tier only allows one web service, so this
  # requires a paid plan.  The app works without it
  # (tile proxy returns 502, map still renders GeoJSON).
  #
  # - type: pserv                      # private service
  #   name: tileserv
  #   runtime: docker
  #   plan: starter
  #   dockerImage: pramsey/pg_tileserv:latest
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: hydrology-db
  #         property: connectionString
